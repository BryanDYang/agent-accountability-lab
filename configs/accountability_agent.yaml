# LLM agent with memory + full accountability layer
agent:
  type: accountability_agent
  description: "LLM agent with memory, reflection, and structured decision traces."
  llm:
    provider: openai
    model: gpt-4o-mini

environment:
  type: gridworld
  size: 10
  max_steps: 1000
  seed: 42

memory:
  episodic: true
  semantic: true
  reflection: true
  vector_store: chroma

accountability:
  enabled: true
  log_observations: true
  log_memory_refs: true
  log_goals: true
  log_candidate_plans: true
  log_explanations: true

logging:
  level: INFO
  output_dir: experiments/results/accountability_agent
